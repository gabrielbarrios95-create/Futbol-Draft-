    <script>
        // --- API DE GEMINI E INFRAESTRUCTURA LLM ---
        const apiKey = ""; // Injected by the environment
        
        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function callGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            try {
                const result = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return result.candidates?.[0]?.content?.parts?.[0]?.text || "No se pudo generar el reporte en este momento.";
            } catch (error) {
                console.error("Gemini API Error:", error);
                return "Error al conectar con la IA. La base de datos de ojeo no está disponible.";
            }
        }

            { name: 'Bukayo Saka', value: 130000000, nationality: 'Inglaterra', position: 'Delantero' },

        ];

        let auctionQueue = [];
        let currentAuctionPlayer = null;
        let currentBid = 0;
        let highestBidder = null;
        let timer = 30;
        let timerInterval = null;
        let isPaused = false;

        function getFlagURL(country) {

                'Francia': 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Flag_of_France.svg',

                'Eslovenia': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Flag_of_Slovenia.svg',
                'Camerún': 'https://upload.wikimedia.org/wikipedia/commons/4/4f/Flag_of_Cameroon.svg',
                'Suiza': 'https://upload.wikimedia.org/wikipedia/commons/f/f3/Flag_of_Switzerland.svg',
                'Hungría': 'https://upload.wikimedia.org/wikipedia/commons/c/c1/Flag_of_Hungary.svg',
                'Senegal': 'https://upload.wikimedia.org/wikipedia/commons/f/fd/Flag_of_Senegal.svg',

            };
            return flagUrls[country] || 'https://upload.wikimedia.org/wikipedia/commons/a/a2/Flag_of_None.svg'; 
        }

        function updateDisplayedName() {
            if (!currentAuctionPlayer) return;

            const name = currentAuctionPlayer.name;
            const parts = name.split(' ');
            let displayedName = '';
            
            displayedName += parts[0].substring(0, revealedFirstNameLength);
            
            if (parts.length > 1) {
                displayedName += ' ';
                const lastName = parts.slice(1).join(' ');
                displayedName += lastName.substring(0, revealedLastNameLength);
            }
            
            const hiddenLength = name.length - displayedName.length;
            const hiddenPart = '*'.repeat(Math.max(0, hiddenLength));

            document.getElementById('player-name').textContent = (displayedName + hiddenPart).trim();
        }

        const numberFormatter = new Intl.NumberFormat('es-ES', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });

        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            const messageText = document.getElementById('message-text');
            
            let bgColor = '';
            let textColor = '';
            if (type === 'success') {
                bgColor = 'bg-emerald-600';
                textColor = 'text-white';
            } else if (type === 'info') {
                bgColor = 'bg-indigo-600';
                textColor = 'text-white';
            } else if (type === 'error') {
                bgColor = 'bg-rose-600';
                textColor = 'text-white';
            }

            container.className = `mt-6 p-4 rounded-lg text-sm font-bold shadow-lg transition-all duration-300 ease-in-out ${bgColor} ${textColor} block`;
            messageText.innerHTML = text;
            
            setTimeout(() => {
                container.classList.add('hidden');
                container.classList.remove('block');
            }, 3000);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function showSection(sectionId) {
            document.getElementById('player-select-section').classList.add('hidden');
            document.getElementById('player-names-section').classList.add('hidden');
            document.getElementById('auction-section').classList.add('hidden');
            document.getElementById('back-btn-global').classList.add('hidden');

            document.getElementById(sectionId).classList.remove('hidden');

            if (sectionId !== 'player-select-section') {
                document.getElementById('back-btn-global').classList.remove('hidden');
            }
        }

        function renderAuctionScreen() {
            const auctionTimerElement = document.getElementById('auction-timer');
            const playerInfoDiv = document.getElementById('player-info');
            const playerFlagImg = document.getElementById('flag-img');
            const playerCountryElement = document.getElementById('player-country');
            const playerPositionElement = document.getElementById('player-position');
            const currentBidTextElement = document.getElementById('current-bid-text');
            const highestBidderTextElement = document.getElementById('highest-bidder-text');
            const bidButtonsContainer = document.getElementById('bid-buttons');
            const playerInventoriesContainer = document.getElementById('player-inventories');
            const hintBtn = document.getElementById('hint-btn');
            const scoutBtn = document.getElementById('scout-btn');
            const scoutReportDiv = document.getElementById('scout-report');

            if (!currentAuctionPlayer) {
                auctionTimerElement.textContent = "¡Fin del Draft!";
                playerInfoDiv.classList.add('hidden');
                bidButtonsContainer.innerHTML = '';
                hintBtn.classList.add('hidden');
                scoutBtn.classList.add('hidden');
                return;
            }

            playerInfoDiv.classList.remove('hidden');
            scoutBtn.classList.remove('hidden');
            
            updateDisplayedName(); 
            playerFlagImg.src = getFlagURL(currentAuctionPlayer.nationality);
            playerFlagImg.alt = `Bandera de ${currentAuctionPlayer.nationality}`;
            playerCountryElement.textContent = currentAuctionPlayer.nationality;
            playerPositionElement.textContent = currentAuctionPlayer.position;
            currentBidTextElement.textContent = numberFormatter.format(currentBid);
            highestBidderTextElement.textContent = highestBidder ? `Postor más alto: ${highestBidder.name}` : 'Nadie ha pujado aún';
            
            bidButtonsContainer.innerHTML = '';
            players.forEach((player, index) => {
                const bidAmount = currentBid + BID_INCREMENT; 
                const button = document.createElement('button');
                
                button.textContent = `Pujar (${player.name})`; 
                button.className = "w-full p-3 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition duration-300 ease-in-out transform hover:scale-105 shadow-md focus:outline-none";
                
                if (player.budget < bidAmount || (highestBidder && highestBidder.name === player.name)) {
                    button.disabled = true;
                    button.textContent = highestBidder && highestBidder.name === player.name ? `Ya eres el postor más alto` : `Sin fondos suficientes`;
                    button.className = "w-full p-3 rounded-lg bg-slate-700 text-slate-500 cursor-not-allowed border border-slate-600";
                } else {
                    button.addEventListener('click', () => handleBid(index, bidAmount));
                }
                bidButtonsContainer.appendChild(button);
            });

            hintBtn.classList.remove('hidden');
            if (hintsUsed >= 2) {
                hintBtn.disabled = true;
                hintBtn.classList.add('cursor-not-allowed', 'opacity-50');
            } else {
                hintBtn.disabled = false;
                hintBtn.classList.remove('cursor-not-allowed', 'opacity-50');
            }

            // Ocultar reporte de ojeador si es un jugador nuevo
            if(scoutReportDiv.dataset.playerId !== currentAuctionPlayer.name) {
                scoutReportDiv.classList.add('hidden');
                scoutReportDiv.innerHTML = "";
            }

            renderPlayerInventories(playerInventoriesContainer);
        }

        // Extraído para poder re-renderizar solo los equipos al usar "Analizar Química"
        function renderPlayerInventories(container) {
            container.innerHTML = '';
            players.forEach(player => {
                const playerDiv = document.createElement('div');
                playerDiv.className = "mb-4 p-4 rounded-lg bg-slate-900 shadow-inner text-left border border-slate-800";
                
                // Header del Equipo
                const headerDiv = document.createElement('div');
                headerDiv.className = "flex justify-between items-center mb-2 border-b border-slate-800 pb-2";
                headerDiv.innerHTML = `
                    <h4 class="font-bold text-lg text-indigo-400">${player.name}</h4>
                    <span class="text-xs text-emerald-500 font-bold bg-emerald-500/10 px-2 py-1 rounded border border-emerald-500/20">${numberFormatter.format(player.budget)}</span>
                `;
                playerDiv.appendChild(headerDiv);
                
                // Lista de Jugadores
                const itemList = document.createElement('ul');
                itemList.className = "space-y-1 list-disc list-inside text-slate-300 text-sm";
                if (player.items.length === 0) {
                    itemList.innerHTML = `<li class="text-slate-500 italic list-none">Sin jugadores fichados</li>`;
                } else {
                    player.items.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = `${item.name} (${item.position})`;
                        itemList.appendChild(li);
                    });
                }
                playerDiv.appendChild(itemList);

                // ✨ Botón de Analizar Química IA
                if (player.items.length > 0) {
                    const analyzeBtn = document.createElement('button');
                    analyzeBtn.className = "mt-4 w-full text-xs bg-indigo-950 hover:bg-indigo-900 border border-indigo-500/30 text-indigo-300 font-bold py-2 px-3 rounded flex items-center justify-center gap-2 transition";
                    analyzeBtn.innerHTML = `✨ Analizar Química del Equipo`;
                    
                    analyzeBtn.onclick = async () => {
                        analyzeBtn.disabled = true;
                        analyzeBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Analizando tácticas...`;

                        const playerNames = player.items.map(p => p.name).join(', ');
                        const prompt = `Actúa como un entrenador de fútbol de élite. Analiza la siguiente plantilla: ${playerNames}. Da una opinión experta muy breve (máximo 3 líneas) sobre el estilo de juego que usarían y su mayor fortaleza o debilidad combinada.`;
                        
                        const analysis = await callGemini(prompt);

                        let analysisDiv = playerDiv.querySelector('.team-analysis');
                        if (!analysisDiv) {
                            analysisDiv = document.createElement('div');
                            analysisDiv.className = "team-analysis mt-3 p-3 bg-indigo-900/30 border border-indigo-500/20 rounded text-xs text-indigo-200 leading-relaxed";
                            playerDiv.appendChild(analysisDiv);
                        }
                        analysisDiv.innerHTML = `<strong class="text-indigo-400">✨ IA Táctica:</strong><br/>${analysis}`;

                        analyzeBtn.innerHTML = `✨ Analizar Química del Equipo`;
                        analyzeBtn.disabled = false;
                    };
                    playerDiv.appendChild(analyzeBtn);
                }

                container.appendChild(playerDiv);
            });
        }
        
        function startCountdown() {
            timer = 30;
            const timerElement = document.getElementById('auction-timer');
            if (timerInterval) clearInterval(timerInterval);
            timerElement.textContent = `${timer}s`;
            
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    timer--;
                    timerElement.textContent = `${timer}s`;
                    if (timer <= 0) {
                        clearInterval(timerInterval);
                        endAuction();
                    }
                }
            }, 1000);
        }

        function startNextAuction() {
            if (auctionQueue.length === 0) {
                showMessage("¡Fin del Draft! El juego ha terminado.", 'success');
                currentAuctionPlayer = null;
                renderAuctionScreen();
                return;
            }
            
            hintsUsed = 0;
            isPaused = false;
            
            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> Pausar`;
            pauseBtn.className = "flex items-center justify-center bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200";

            // Botón de IA a su estado original
            const scoutBtn = document.getElementById('scout-btn');
            scoutBtn.innerHTML = `✨ Ojeador IA`;
            scoutBtn.disabled = false;

            const nextPlayer = auctionQueue.shift();
            currentAuctionPlayer = nextPlayer;
            currentBid = currentAuctionPlayer.value;
            highestBidder = null;
            
            const nameParts = currentAuctionPlayer.name.split(' ');
            revealedFirstNameLength = 1;
            revealedLastNameLength = nameParts.length > 1 ? 1 : 0;

            renderAuctionScreen();
            startCountdown();
        }

        function endAuction() {
            if (highestBidder) {
                highestBidder.budget -= currentBid;
                highestBidder.items.push(currentAuctionPlayer);
                showMessage(`¡${highestBidder.name} ficha a ${currentAuctionPlayer.name} por ${numberFormatter.format(currentBid)}!`, 'success');
            } else {
                showMessage(`Nadie ofertó por ${currentAuctionPlayer.name}. Regresa a la agencia libre.`, 'info');
                auctionQueue.push(currentAuctionPlayer); 
                shuffle(auctionQueue);
            }
            
            currentAuctionPlayer = null;
            renderAuctionScreen();

            setTimeout(() => {
                startNextAuction();
            }, 3000);
        }

        function handleBid(playerIndex, bidAmount) {
            const player = players[playerIndex];
            if (player.budget >= bidAmount) {
                currentBid = bidAmount;
                highestBidder = player;
                startCountdown(); 
                renderAuctionScreen();
            } else {
                showMessage("No tienes presupuesto suficiente.", 'error');
            }
        }

        function handleHint() {
            if (!highestBidder) {
                showMessage("Debe haber una puja inicial para usar la pista.", 'error');
                return;
            }

            if (highestBidder.budget < HINT_COST) {
                showMessage(`${highestBidder.name} no tiene presupuesto para comprar una pista.`, 'error');
                return;
            }

            if (hintsUsed < 2) {
                highestBidder.budget -= HINT_COST;
                hintsUsed++;
                
                const nameParts = currentAuctionPlayer.name.split(' ');
                if (revealedFirstNameLength < nameParts[0].length) {
                    revealedFirstNameLength++;
                }
                if (nameParts.length > 1 && revealedLastNameLength < nameParts.slice(1).join(' ').length) {
                    revealedLastNameLength++;
                }

                startCountdown(); 
                renderAuctionScreen();
                showMessage(`Pista revelada para ${highestBidder.name}.`, 'info');
            }
        }

        // --- Manejo del Ojeador IA (Gemini) ---
        document.getElementById('scout-btn').addEventListener('click', async () => {
            if (!currentAuctionPlayer) return;
            const btn = document.getElementById('scout-btn');
            const reportDiv = document.getElementById('scout-report');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Consultando Red de Ojeadores...`;

            // Pausar el juego para leer el reporte tranquilamente
            if(!isPaused) togglePause();

            const prompt = `Actúa como un experto ojeador de fútbol. Escribe un reporte de ojeo muy breve y emocionante (máximo 3 líneas) sobre el jugador ${currentAuctionPlayer.name} (${currentAuctionPlayer.position}, de ${currentAuctionPlayer.nationality}). Destaca su mayor fortaleza en el campo sin decir su nombre directamente si quieres mantener un poco el misterio.`;

            const report = await callGemini(prompt);

            reportDiv.innerHTML = `<strong class="text-indigo-400"><i class="fa-solid fa-file-contract"></i> ✨ Reporte de la Red de Ojeadores:</strong><br/><span class="mt-2 block">${report}</span>`;
            reportDiv.classList.remove('hidden');
            reportDiv.dataset.playerId = currentAuctionPlayer.name;

            btn.innerHTML = `<i class="fa-solid fa-check mr-2"></i> Reporte Completado`;
            // Dejarlo deshabilitado para este jugador (solo un uso por jugador para no gastar API)
        });

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            if (isPaused) {
                pauseBtn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> Reanudar`;
                pauseBtn.classList.remove('bg-amber-600', 'hover:bg-amber-700');
                pauseBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
                showMessage("Subasta pausada temporalmente.", 'info');
            } else {
                pauseBtn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i> Pausar`;
                pauseBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                pauseBtn.classList.add('bg-amber-600', 'hover:bg-amber-700');
                showMessage("Subasta reanudada.", 'info');
            }
        }

        // --- Event Listeners ---
        document.getElementById('start-draft-btn').addEventListener('click', () => {
            const numPlayers = parseInt(document.getElementById('num-players').value);
            const container = document.getElementById('player-name-inputs');
            container.innerHTML = '';
            
            for (let i = 0; i < numPlayers; i++) {
                const inputGroup = document.createElement('div');
                inputGroup.className = 'flex flex-col text-left space-y-1';
                inputGroup.innerHTML = `
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nombre del Equipo ${i + 1}</label>
                    <input type="text" placeholder="Ej. Real Madrid, Arsenal..." class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500 transition duration-200">
                `;
                container.appendChild(inputGroup);
            }
            showSection('player-names-section');
        });

        document.getElementById('confirm-names-btn').addEventListener('click', () => {
            const inputs = document.getElementById('player-name-inputs').querySelectorAll('input');
            players = [];
            let valid = true;
            
            inputs.forEach(input => {
                const name = input.value.trim();
                if (!name) valid = false;
                players.push({
                    name: name,
                    budget: INITIAL_BUDGET,
                    items: []
                });
            });

            if (!valid) {
                showMessage("Por favor, ponle nombre a todos los equipos.", "error");
                return;
            }

            auctionQueue = [...itemPool];
            shuffle(auctionQueue);
            
            showSection('auction-section');
            startNextAuction();
        });

        document.getElementById('hint-btn').addEventListener('click', handleHint);
        document.getElementById('pause-btn').addEventListener('click', togglePause);

        document.getElementById('back-btn-global').addEventListener('click', () => {
            const playerNamesSection = document.getElementById('player-names-section');
            const auctionSection = document.getElementById('auction-section');
            
            if (!playerNamesSection.classList.contains('hidden')) {
                showSection('player-select-section');
            } else if (!auctionSection.classList.contains('hidden')) {
                if (timerInterval) clearInterval(timerInterval);
                showSection('player-names-section');
            }
        });

    </script>
</body>
</html>
